[project]
name = "ragas"
description = "Evaluation framework for RAG and LLM applications"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
    # Core dependencies
    "numpy>=1.21.0,<3.0.0",
    "datasets>=4.0.0",
    "tiktoken",
    "pydantic>=2.0.0",
    "nest-asyncio",
    "appdirs",
    "diskcache>=5.6.3",
    "typer",
    "rich",
    "openai>=1.0.0",
    "tqdm",
    "instructor",
    "pillow>=10.4.0",
    "networkx",
    "scikit-network",
    "requests",
    "tenacity",

    # LangChain ecosystem
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain_openai",
]
dynamic = ["version", "readme"]

[project.urls]
Homepage = "https://github.com/vibrantlabsai/ragas"
Documentation = "https://docs.ragas.io"
Code = "https://github.com/vibrantlabsai/ragas"
Issues = "https://github.com/vibrantlabsai/ragas/issues"

[project.optional-dependencies]
# Core optional features
all = [
    "sentence-transformers",
    "transformers",
    "nltk",
    "rouge_score",
    "rapidfuzz",
    "pandas",
    "datacompy",
    "sacrebleu",
    "llama_index",
    "r2r",
    "GitPython"
]

# Specific integrations
git = ["GitPython"]
tracing = ["langfuse>=3.2.4", "mlflow>=3.1.4"]
gdrive = [
    "google-api-python-client>=2.178.0",
    "google-auth>=2.40.3",
    "google-auth-oauthlib>=1.2.2"
]
ai-frameworks = ["haystack-ai"]
oci = ["oci>=2.160.1"]
ag-ui = ["ag-ui-protocol>=0.1.9", "httpx>=0.27.0"]
dspy = ["dspy-ai>=2.4.0"]

# Minimal dev dependencies for fast development setup (used by make install-minimal).
# Besides the tools, this holds the light optional packages the unit tests import, so
# the whole unit suite runs without the heavy ML stack (torch, transformers) in `dev`.
dev-minimal = [
    "ruff>=0.16,<0.17",  # one minor series: the formatter changes output between minors
    "pyright>=1.1.403",
    "pre-commit>=4.3.0",
    "pytest",
    "pytest-xdist[psutil]",
    "pytest-asyncio",
    # Optional packages imported by unit tests
    "ragas[git,gdrive]",
    "rapidfuzz",
    "sacrebleu",
    "llama-index-core",
    # These releases evaluate `X | None` at runtime, which fails on Python 3.9
    "banks<2.4.4; python_version < '3.10'",
    "llama-index-core<0.14.15; python_version < '3.10'",
    "nbmake",
    "build>=1.3.0",
    "pytest-cov",
    # lightweight optional dependency, so tests/unit/integrations/test_ag_ui.py runs instead of skipping
    "ag-ui-protocol>=0.1.9",
]

# Test only dependencies
test = [
    "scipy",
]

[project.entry-points."ragas.backends"]
"local/csv" = "ragas.backends.local_csv:LocalCSVBackend"
"local/jsonl" = "ragas.backends.local_jsonl:LocalJSONLBackend"
"inmemory" = "ragas.backends.inmemory:InMemoryBackend"
"gdrive" = "ragas.backends.gdrive_backend:GDriveBackend"

[project.scripts]
ragas = "ragas.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.ruff]
line-length = 88
target-version = "py39"
exclude = ["*.ipynb", "*/_version.py"]  # Exclude Jupyter notebooks and auto-generated version files from linting

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear: likely bugs and design problems
    "C4",      # flake8-comprehensions
    "C90",     # mccabe complexity (threshold below)
    "SIM",     # flake8-simplify
    "PIE",     # flake8-pie: unnecessary pass/ellipsis, duplicate keys
    "RUF",     # ruff-specific rules (exceptions listed below)
    "T10",     # leftover debugger calls
    "PGH004",  # blanket `# noqa` without a rule code
]
# pyupgrade (UP) is deliberately not enabled: the project supports Python 3.9,
# where `X | None` and builtin generics in runtime-evaluated annotations fail.
ignore = [
    "E501",    # line length is handled by the formatter
    "SIM108",  # ternaries are not always clearer than an if/else block
    "SIM117",  # Python 3.9 has no parenthesized context managers, so merged
               # `with` statements cannot be wrapped by the formatter
    "RUF001",  # ambiguous unicode in strings: prompts and docs use real
    "RUF002",  #   typography (curly quotes, dashes, non-breaking hyphens)
    "RUF003",  #   on purpose
    "RUF009",  # prompts are dataclass field defaults built at class creation;
               # moving them to default_factory would change instance sharing
    "RUF012",  # flags pydantic fields and per-subclass prompt `examples`;
               # ClassVar would remove them from the pydantic models
    "RUF022",  # `__all__` lists are grouped by topic, not sorted
]

[tool.ruff.lint.mccabe]
# Functions above this are refactor candidates. The few existing ones that
# exceed it carry a `# noqa: C901` so new complexity is caught in review.
max-complexity = 15

[tool.ruff.lint.isort]
# Import sorting configuration
known-first-party = ["ragas"]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = false
preview = false

[tool.pyright]
include = ["src/ragas"]
exclude = ["@types/*"]
pythonVersion = "3.9"
pythonPlatform = "All"
typeCheckingMode = "basic"
# Optional dependencies are imported lazily and carry a per-line
# `# pyright: ignore[reportMissingImports]`, so any other unresolved import
# (a typo, or a module removed upstream) fails the type check.
reportMissingImports = "error"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportGeneralTypeIssues = "warning"
reportReturnType = "warning"

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Path to version file relative to this pyproject.toml
version_file = "src/ragas/_version.py"

[tool.uv]
# `uv run` and `uv sync` install no dependency group unless asked. Otherwise every
# `uv run` would pull the full `dev` group (torch, CUDA, about 7 GB) into a
# `make install-minimal` environment. `make install` asks for `--group dev` explicitly.
default-groups = []

# UV Workspace Configuration
[tool.uv.workspace]
members = [".", "examples"]

# Workspace dependency sources
[tool.uv.sources]
ragas-examples = { workspace = true }

[tool.pytest.ini_options]
addopts = "-n 0"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["ragas"]
omit = ["*/ragas/_version.py"]

[tool.coverage.report]
# Measured 71.6% on Python 3.12 with the full dev environment; raise this as coverage improves.
fail_under = 70
show_missing = true
skip_covered = true
precision = 1
exclude_also = [
    "if t.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
# Full dev dependencies with all features (used by make install)
dev = [
    # Core dev tools (shared with minimal)
    "ruff>=0.16,<0.17",  # one minor series: the formatter changes output between minors
    "pyright>=1.1.403",
    "pre-commit>=4.3.0",
    "pytest",
    "pytest-xdist[psutil]",
    "pytest-asyncio",
    "pytest-cov",
    "build>=1.3.0",
    # Additional tools for full dev
    "nbmake",
    "notebook",
    "unstructured[md]",
    # These releases evaluate `X | None` at runtime, which fails on Python 3.9
    "banks<2.4.4; python_version < '3.10'",
    "llama-index-core<0.14.15; python_version < '3.10'",
    # langchain-community 0.4 removed chat_models.vertexai, imported by ragas.llms.base
    "langchain-community<0.4",
    # langfuse 4 stopped accepting htmlPath in TraceWithFullDetails, breaking sync_trace
    "langfuse<4",
    # haystack-ai 3 and the numpy 2.4 stubs fail `make type`
    "haystack-ai<3",
    "numpy<2.4",
    "openinference-instrumentation-langchain>=0.1.29",
    # Include all optional features
    "ragas[all,tracing,gdrive,ai-frameworks,ag-ui]",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material",
    "mkdocs-material[imaging]",
    "mkdocstrings[python]",
    "mkdocs-glightbox",
    "mkdocs-autorefs",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "mkdocs-git-committers-plugin-2",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-copy-to-llm",
    "mkdocs-llmstxt",  # Requires Python 3.10+, only used in docs CI
]

docs-pdf = [
    "mkdocs-to-pdf>=0.10.1",
    "mkdocs-mermaid-to-svg"
]